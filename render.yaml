services:
  - type: web
    name: visitsmart-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://visitsmart.onrender.com
      - key: MONGOURL
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false

  - type: web
    name: visitsmart
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://visitsmart-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
